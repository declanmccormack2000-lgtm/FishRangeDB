<!doctype html>
<html lang="{{lang}}" data-root="{{root}}">
<head>
{{head}}
<title>[[search_title]] - FishRangeDB</title>
</head>
<body>
{{header}}
<main class="column">
  <div class="page-head">
    <h1>[[search_title]]</h1>
    <p>[[search_tagline]]</p>
  </div>

  <form id="search" class="search-form" role="search">
    <div class="field grow">
      <label for="q">[[name_or_family]]</label>
      <input id="q" name="q" type="search" placeholder="[[search_placeholder]]" autocomplete="off">
    </div>
    <div class="field">
      <label for="type">[[record_type]]</label>
      <select id="type" name="type">
        <option value="">[[all_records]]</option>
        <option value="occurrence">[[occurrence]]</option>
        <option value="catch">[[catch]]</option>
        <option value="length">[[body_length]]</option>
        <option value="trend">[[size_trend]]</option>
      </select>
    </div>
    <div class="field">
      <label for="class">[[class_label]]</label>
      <select id="class" name="class"><option value="">[[all_classes]]</option></select>
    </div>
    <div class="field">
      <label for="sort">[[sort_by]]</label>
      <select id="sort" name="sort">
        <option value="">[[sort_name]]</option>
        <option value="occ">[[sort_occ]]</option>
        <option value="catch">[[sort_catch]]</option>
      </select>
    </div>
    <button class="btn" type="submit">[[search_btn]]</button>
  </form>

  <section class="panel" aria-live="polite">
    <h2>[[results_h]]</h2>
    <p id="status">[[loading_species]]</p>
    <div id="named"></div>
    <div id="results"></div>
  </section>
  <div id="pager" class="pager"></div>
</main>
{{footer}}
{{scripts}}
<script src="{{root}}assets/search.js"></script>
</body>
</html>

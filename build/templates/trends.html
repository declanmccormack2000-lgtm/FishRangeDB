<!doctype html>
<html lang="{{lang}}" data-root="{{root}}">
<head>
{{head}}
<title>[[trends_title]] - FishRangeDB</title>
</head>
<body>
{{header}}
<main class="column">
  <div class="page-head">
    <h1>[[trends_title]]</h1>
    <p>[[trends_tagline]]</p>
  </div>

  <form id="filters" class="search-form">
    <div class="field grow">
      <label for="q">[[sci_name]]</label>
      <input id="q" type="search" placeholder="Gadus morhua" autocomplete="off">
    </div>
    <div class="field">
      <label for="result">[[result]]</label>
      <select id="result">
        <option value="">[[all_results]]</option>
        <option value="decreasing">[[decreasing]]</option>
        <option value="increasing">[[increasing]]</option>
        <option value="no clear change">[[no_change]]</option>
      </select>
    </div>
    <div class="field">
      <label for="length">[[length_label]]</label>
      <select id="length">
        <option value="">[[all_lengths]]</option>
        <option value="TL">[[len_TL]]</option>
        <option value="FL">[[len_FL]]</option>
        <option value="SL">[[len_SL]]</option>
        <option value="PCL">[[len_PCL]]</option>
        <option value="unspecified">[[len_unspecified]]</option>
      </select>
    </div>
  </form>

  <section class="panel">
    <h2>[[estimates_h]]</h2>
    <p>[[estimates_p]]</p>
    <p id="status" aria-live="polite">[[loading_estimates]]</p>
    <div id="results"></div>
  </section>
  <div id="pager" class="pager"></div>

  <section class="panel">
    <h2>[[method_h]]</h2>
    <p>[[method_p1]]</p>
    <p>[[trend_caveat]]</p>
  </section>
</main>
{{footer}}
{{scripts}}
<script src="{{root}}assets/trends.js"></script>
</body>
</html>

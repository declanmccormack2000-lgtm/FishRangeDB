<!doctype html>
<html lang="ja" data-root="../">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<link rel="alternate" hreflang="en" href="../search.html">
<link rel="alternate" hreflang="ja" href="search.html">
<link rel="stylesheet" href="../assets/site.css">

<title>検索 - FishRangeDB</title>
</head>
<body>
<header class="site-header">
  <p class="site-title"><a href="index.html">マコーミック<br>海洋研究所</a></p>
  <nav aria-label="メイン">
    <a class="btn" href="index.html#introduction">はじめに</a>
    <a class="btn" href="index.html#map">地図</a>
    <a class="btn" href="search.html">検索</a>
    <a class="btn" href="index.html#holdings">収録データ</a>
    <a class="btn" href="trends.html">体長の傾向</a>
    <a class="btn" href="index.html#downloads">ダウンロード</a>
    <a class="btn" href="index.html#disclaimer">免責事項</a>
    <a class="btn" href="index.html#whats-new">更新情報</a>
    <a class="btn lang-switch" id="lang-switch" href="../search.html" hreflang="en" lang="en" title="View this page in English">English</a>
  </nav>
</header>

<main class="column">
  <div class="page-head">
    <h1>検索</h1>
    <p>学名、和名、英名、属名、科名で種を探します。</p>
  </div>

  <form id="search" class="search-form" role="search">
    <div class="field grow">
      <label for="q">学名・和名・英名</label>
      <input id="q" name="q" type="search" placeholder="マダイ、Pagrus major" autocomplete="off">
    </div>
    <div class="field">
      <label for="type">記録の種類</label>
      <select id="type" name="type">
        <option value="">すべての記録</option>
        <option value="occurrence">出現</option>
        <option value="catch">漁獲</option>
        <option value="length">体長</option>
        <option value="trend">体長の傾向</option>
      </select>
    </div>
    <div class="field">
      <label for="class">綱</label>
      <select id="class" name="class"><option value="">すべての綱</option></select>
    </div>
    <div class="field">
      <label for="sort">並べ替え</label>
      <select id="sort" name="sort">
        <option value="">名前</option>
        <option value="occ">出現記録の多い順</option>
        <option value="catch">漁獲量の多い順</option>
      </select>
    </div>
    <button class="btn" type="submit">検索</button>
  </form>

  <section class="panel" aria-live="polite">
    <h2>結果</h2>
    <p id="status">種の一覧を読み込んでいます。</p>
    <div id="named"></div>
    <div id="results"></div>
  </section>
  <div id="pager" class="pager"></div>
</main>
<footer class="site-footer">(c) マコーミック海洋研究所</footer>

<script src="../assets/i18n.js"></script>
<script src="../assets/site.js"></script>

<script src="../assets/search.js"></script>
</body>
</html>

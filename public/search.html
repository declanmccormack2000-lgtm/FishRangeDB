<!doctype html>
<html lang="en" data-root="">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<link rel="alternate" hreflang="en" href="search.html">
<link rel="alternate" hreflang="ja" href="ja/search.html">
<link rel="stylesheet" href="assets/site.css">

<title>Search - FishRangeDB</title>
</head>
<body>
<header class="site-header">
  <p class="site-title"><a href="index.html">McCormack Marine<br>Institute</a></p>
  <nav aria-label="Main">
    <a class="btn" href="index.html#introduction">Introduction</a>
    <a class="btn" href="index.html#map">Map</a>
    <a class="btn" href="search.html">Search</a>
    <a class="btn" href="index.html#holdings">Holdings</a>
    <a class="btn" href="trends.html">Size Trends</a>
    <a class="btn" href="index.html#downloads">Downloads</a>
    <a class="btn" href="index.html#disclaimer">Disclaimer</a>
    <a class="btn" href="index.html#whats-new">What's New</a>
    <a class="btn lang-switch" id="lang-switch" href="ja/search.html" hreflang="ja" lang="ja" title="このページを日本語で表示">日本語</a>
  </nav>
</header>

<main class="column">
  <div class="page-head">
    <h1>Search</h1>
    <p>Find a species by scientific name, common name, genus or family, in English or Japanese.</p>
  </div>

  <form id="search" class="search-form" role="search">
    <div class="field grow">
      <label for="q">Scientific or common name</label>
      <input id="q" name="q" type="search" placeholder="Gadus morhua, Atlantic cod" autocomplete="off">
    </div>
    <div class="field">
      <label for="type">Record type</label>
      <select id="type" name="type">
        <option value="">All records</option>
        <option value="occurrence">Occurrence</option>
        <option value="catch">Catch</option>
        <option value="length">Body length</option>
        <option value="trend">Size trend</option>
      </select>
    </div>
    <div class="field">
      <label for="class">Class</label>
      <select id="class" name="class"><option value="">All classes</option></select>
    </div>
    <div class="field">
      <label for="sort">Sort by</label>
      <select id="sort" name="sort">
        <option value="">Name</option>
        <option value="occ">Most occurrence records</option>
        <option value="catch">Most catch</option>
      </select>
    </div>
    <button class="btn" type="submit">Search</button>
  </form>

  <section class="panel" aria-live="polite">
    <h2>Results</h2>
    <p id="status">Loading the species list.</p>
    <div id="named"></div>
    <div id="results"></div>
  </section>
  <div id="pager" class="pager"></div>
</main>
<footer class="site-footer">(c) McCormack Marine Institute</footer>

<script src="assets/i18n.js"></script>
<script src="assets/site.js"></script>

<script src="assets/search.js"></script>
</body>
</html>
